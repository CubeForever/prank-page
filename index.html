<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>灵魂性格解码</title>
<style>
:root{
  --primary:#667eea;--primary-dark:#764ba2;
  --accent:#ff6b6b;--accent2:#ee5a24;
  --bg-card:rgba(255,255,255,.95);
  --text:#333;--text-light:#666;--text-muted:#bbb;
  --border:#e0e0e0;--radius:12px;--radius-lg:16px;
  --shadow:0 20px 60px rgba(0,0,0,.25);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font)}
body{-webkit-overflow-scrolling:touch;overscroll-behavior:none}

/* ===== 共享 ===== */
.page{position:fixed;top:0;left:0;width:100%;height:100%;transition:opacity .4s}
.page.hidden{opacity:0;pointer-events:none}
.page.gone{display:none}
#formPage{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10;
}
.form-title{color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:24px;text-shadow:0 2px 10px rgba(0,0,0,.3);line-height:1.6}
.form-title .emoji{font-size:26px;display:block;margin-bottom:6px}
.form-subtitle{color:rgba(255,255,255,.65);font-size:12px;text-align:center;margin-top:16px;line-height:1.5}

/* 进度条 */
.progress-bar{width:100%;max-width:360px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:2px;transition:width .4s ease;width:0%}
.step-label{color:rgba(255,255,255,.5);font-size:11px;text-align:center;margin-bottom:12px}

/* 表单卡片 */
.form-card{width:100%;max-width:360px;background:var(--bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);min-height:200px;position:relative;overflow:hidden}
.step{display:none}
.step.active{display:block;animation:stepIn .3s ease}
@keyframes stepIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.field input,.field select{width:100%;height:44px;border:2px solid var(--border);border-radius:10px;padding:0 14px;font-size:15px;color:var(--text);outline:none;transition:border-color .2s;appearance:none;background:#fafafa}
.field input:focus,.field select:focus{border-color:var(--primary);background:#fff}
.field input::placeholder{color:var(--text-muted)}

/* 标签选择 */
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag-item{
  padding:8px 16px;border:2px solid var(--border);border-radius:20px;
  font-size:13px;color:var(--text-light);cursor:pointer;transition:all .2s;
  background:#fafafa;user-select:none;
}
.tag-item.selected{border-color:var(--primary);color:var(--primary);background:#f0eeff;font-weight:600}
.tag-item:active{transform:scale(.95)}

/* 时间段选择 */
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time-item{
  text-align:center;padding:10px 4px;border:2px solid var(--border);border-radius:10px;
  font-size:12px;color:var(--text-light);cursor:pointer;transition:all .2s;background:#fafafa;
}
.time-item .icon{font-size:18px;display:block;margin-bottom:2px}
.time-item.selected{border-color:var(--primary);color:var(--primary);background:#f0eeff;font-weight:600}

/* 性别 */
.gender-row{display:flex;gap:12px}
.gender-row label{
  flex:1;display:flex;align-items:center;justify-content:center;
  height:44px;border:2px solid var(--border);border-radius:10px;
  font-size:15px;color:var(--text-light);cursor:pointer;transition:all .2s;background:#fafafa;
}
.gender-row input{display:none}
.gender-row input:checked+label{border-color:var(--primary);color:var(--primary);background:#f0eeff;font-weight:600}

/* 按钮 */
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;height:46px;border:none;border-radius:var(--radius);
  font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;
}
.btn:active{transform:scale(.97)}
.btn-prev{background:#f0f0f0;color:var(--text-light)}
.btn-next{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 15px rgba(238,90,36,.35)}
.btn-next.full{flex:2}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== 分析页 ===== */
#analyzingPage{
  background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;
}
.analyze-ring{
  width:120px;height:120px;position:relative;margin-bottom:30px;
}
.analyze-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.analyze-ring .bg{stroke:rgba(255,255,255,.08);fill:none;stroke-width:4}
.analyze-ring .fg{stroke:var(--accent);fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:339.29;stroke-dashoffset:339.29;transition:stroke-dashoffset .3s}
.analyze-percent{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:32px;font-weight:700;
}
.analyze-text{color:rgba(255,255,255,.6);font-size:14px;text-align:center;min-height:40px;transition:opacity .3s}
.analyze-dots{color:rgba(255,255,255,.3);font-size:11px;margin-top:12px;letter-spacing:2px}
@keyframes dotPulse{0%,100%{opacity:.3}50%{opacity:1}}

/* ===== 恐怖页 ===== */
#scarePage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:#000}
#scarePage.show{display:block}
#scareCanvas{width:100%;height:100%;position:absolute;top:0;left:0}
#flashOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;opacity:0;pointer-events:none;z-index:101;transition:opacity 0.03s}
#bloodBorder{position:absolute;top:0;left:0;width:100%;height:100%;border:8px solid transparent;z-index:104;pointer-events:none;animation:bloodPulse .2s infinite}
@keyframes bloodPulse{
  0%,100%{border-color:transparent;box-shadow:inset 0 0 40px rgba(255,0,0,0)}
  50%{border-color:#aa0000;box-shadow:inset 0 0 120px rgba(255,0,0,.6)}
}
.scanlines{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);
  pointer-events:none;z-index:105;animation:scanMove .08s linear infinite;
}
@keyframes scanMove{from{background-position:0 0}to{background-position:0 4px}}

/* 二次惊吓 */
#secondScare{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:200}
#secondScare.show{display:block}
#secondCanvas{width:100%;height:100%}

/* 吐司提示 */
@keyframes toastFade{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
  10%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1}100%{opacity:0}
}
</style>
</head>
<body>

<!-- ===== 表单页 ===== -->
<div id="formPage" class="page">
  <div class="form-title">
    <span class="emoji">🔮</span>
    灵魂性格解码
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="step-label" id="stepLabel">第 1 步 / 共 4 步</div>
  <div class="form-card" id="formCard">

    <!-- Step 1: 生日时辰 -->
    <div class="step active" data-step="1">
      <div class="field"><label>🎂 你的生日</label><input type="date" id="birthdayInput"></div>
      <div class="field"><label>🌙 出生时辰（可随便选）</label>
        <div class="time-grid" id="timeGrid">
          <div class="time-item" data-val="子时"><span class="icon">🐭</span>子时<br><small>23-01</small></div>
          <div class="time-item" data-val="丑时"><span class="icon">🐂</span>丑时<br><small>01-03</small></div>
          <div class="time-item" data-val="寅时"><span class="icon">🐅</span>寅时<br><small>03-05</small></div>
          <div class="time-item" data-val="卯时"><span class="icon">🐇</span>卯时<br><small>05-07</small></div>
          <div class="time-item" data-val="辰时"><span class="icon">🐉</span>辰时<br><small>07-09</small></div>
          <div class="time-item" data-val="巳时"><span class="icon">🐍</span>巳时<br><small>09-11</small></div>
          <div class="time-item" data-val="午时"><span class="icon">🐎</span>午时<br><small>11-13</small></div>
          <div class="time-item" data-val="未时"><span class="icon">🐑</span>未时<br><small>13-15</small></div>
          <div class="time-item" data-val="申时"><span class="icon">🐒</span>申时<br><small>15-17</small></div>
          <div class="time-item" data-val="酉时"><span class="icon">🐔</span>酉时<br><small>17-19</small></div>
          <div class="time-item" data-val="戌时"><span class="icon">🐶</span>戌时<br><small>19-21</small></div>
          <div class="time-item" data-val="亥时"><span class="icon">🐷</span>亥时<br><small>21-23</small></div>
        </div>
      </div>
      <div class="btn-row"><button class="btn btn-next full" id="next1">下一步 →</button></div>
    </div>

    <!-- Step 2: 关键词 -->
    <div class="step" data-step="2">
      <div class="field"><label>✨ 选 3 个关键词描述你自己</label>
        <div class="tag-grid" id="tagGrid">
          <div class="tag-item" data-tag="温柔">温柔</div>
          <div class="tag-item" data-tag="幽默">幽默</div>
          <div class="tag-item" data-tag="理性">理性</div>
          <div class="tag-item" data-tag="感性">感性</div>
          <div class="tag-item" data-tag="独立">独立</div>
          <div class="tag-item" data-tag="念旧">念旧</div>
          <div class="tag-item" data-tag="完美主义">完美主义</div>
          <div class="tag-item" data-tag="乐观">乐观</div>
          <div class="tag-item" data-tag="好奇心强">好奇心强</div>
          <div class="tag-item" data-tag="社恐">社恐</div>
          <div class="tag-item" data-tag="理想主义">理想主义</div>
          <div class="tag-item" data-tag="行动派">行动派</div>
        </div>
      </div>
      <div class="btn-row"><button class="btn btn-prev" id="prev2">← 上一步</button><button class="btn btn-next" id="next2">下一步 →</button></div>
    </div>

    <!-- Step 3: 性别 -->
    <div class="step" data-step="3">
      <div class="field"><label>👤 你的性别</label>
        <div class="gender-row">
          <input type="radio" name="gender" id="male" value="male"><label for="male">男</label>
          <input type="radio" name="gender" id="female" value="female"><label for="female">女</label>
        </div>
      </div>
      <div class="field"><label>🔮 姓名（用于解读）</label><input type="text" id="nameInput" placeholder="请输入你的姓名" autocomplete="off"></div>
      <div class="btn-row"><button class="btn btn-prev" id="prev3">← 上一步</button><button class="btn btn-next" id="next3">下一步 →</button></div>
    </div>

    <!-- Step 4: 手机号 -->
    <div class="step" data-step="4">
      <div class="field"><label>📱 手机号（生成专属命盘）</label><input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11" autocomplete="off"></div>
      <div style="text-align:center;padding:16px 0 4px;font-size:36px">🌟</div>
      <p style="text-align:center;color:var(--text-light);font-size:13px;line-height:1.8">
        所有信息已准备就绪<br>点击下方按钮揭晓你的灵魂密码
      </p>
      <div class="btn-row"><button class="btn btn-prev" id="prev4">← 上一步</button><button class="btn btn-next" id="submitBtn">✨ 揭晓灵魂密码</button></div>
    </div>

  </div>
  <div class="form-subtitle">纯属娱乐 · 结果仅供消遣</div>
</div>

<!-- ===== 分析页 ===== -->
<div id="analyzingPage" class="page gone hidden">
  <div class="analyze-ring">
    <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="ringFg" cx="60" cy="60" r="54"/></svg>
    <div class="analyze-percent" id="analyzePercent">0%</div>
  </div>
  <div class="analyze-text" id="analyzeText">正在连接灵魂数据库...</div>
  <div class="analyze-dots">···</div>
</div>

<!-- ===== 恐怖页 ===== -->
<div id="scarePage">
  <canvas id="scareCanvas"></canvas>
  <div id="flashOverlay"></div>
  <div id="bloodBorder"></div>
  <div class="scanlines"></div>
</div>

<!-- ===== 二次惊吓 ===== -->
<div id="secondScare"><canvas id="secondCanvas"></canvas></div>

<script>
(function(){
  function $(id){return document.getElementById(id)}
  document.body.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});

  /* ======================== 表单逻辑 ======================== */
  var currentStep=1,totalSteps=4;
  var selectedTime='',selectedTags=[];
  var isRunning=false;

  function updateProgress(){
    $('progressFill').style.width=((currentStep-1)/totalSteps*100)+'%';
    $('stepLabel').textContent='第 '+currentStep+' 步 / 共 '+totalSteps+' 步';
  }
  function goStep(n){
    document.querySelectorAll('.step').forEach(function(s){s.classList.remove('active')});
    var target=document.querySelector('[data-step="'+n+'"]');
    if(target)target.classList.add('active');
    currentStep=n;updateProgress();
  }
  // 时间选择
  $('timeGrid').addEventListener('click',function(e){
    var item=e.target.closest('.time-item');if(!item)return;
    document.querySelectorAll('#timeGrid .time-item').forEach(function(t){t.classList.remove('selected')});
    item.classList.add('selected');selectedTime=item.dataset.val;
  });
  // 标签选择(最多3个)
  $('tagGrid').addEventListener('click',function(e){
    var item=e.target.closest('.tag-item');if(!item)return;
    var tag=item.dataset.tag;
    if(item.classList.contains('selected')){
      item.classList.remove('selected');
      selectedTags=selectedTags.filter(function(t){return t!==tag});
    }else{
      if(selectedTags.length>=3){showToast('最多选 3 个哦');return}
      item.classList.add('selected');selectedTags.push(tag);
    }
  });
  // 步骤按钮
  $('next1').addEventListener('click',function(){
    if(!$('birthdayInput').value){showToast('请选择生日');return}
    if(!selectedTime){showToast('请选择出生时辰');return}
    goStep(2);
  });
  $('prev2').addEventListener('click',function(){goStep(1)});
  $('next2').addEventListener('click',function(){
    if(selectedTags.length<3){showToast('请选择 3 个关键词');return}
    goStep(3);
  });
  $('prev3').addEventListener('click',function(){goStep(2)});
  $('next3').addEventListener('click',function(){
    if(!document.querySelector('input[name="gender"]:checked')){showToast('请选择性别');return}
    if(!$('nameInput').value.trim()){showToast('请输入姓名');return}
    goStep(4);
  });
  $('prev4').addEventListener('click',function(){goStep(3)});
  // 提交
  $('submitBtn').addEventListener('click',function(){
    if(isRunning)return;
    if(!/^1\d{10}$/.test($('phoneInput').value.trim())){showToast('请输入正确的手机号');return}
    isRunning=true;
    startAnalyzing();
  });

  /* ======================== 分析页 ======================== */
  var analyzePhrases=[
    '正在连接灵魂数据库...',
    '正在解析你的性格密码...',
    '正在读取星座命盘数据...',
    '正在计算命运轨迹...',
    '正在与潜意识建立链接...',
    '正在生成专属灵魂画像...',
    '正在破解你的前世记忆...',
    '即将揭晓灵魂密码...'
  ];
  function startAnalyzing(){
    // 切换页面
    $('formPage').classList.add('hidden');
    setTimeout(function(){$('formPage').classList.add('gone');$('analyzingPage').classList.remove('gone')},400);
    setTimeout(function(){$('analyzingPage').classList.remove('hidden')},450);

    // 动画
    var ring=$('ringFg'),pct=$('analyzePercent'),txt=$('analyzeText');
    var circumference=339.29;
    var startTime=performance.now(),duration=4000;
    function animateRing(){
      var elapsed=performance.now()-startTime;
      var progress=Math.min(elapsed/duration,1);
      // easing
      var eased=1-Math.pow(1-progress,3);
      ring.style.strokeDashoffset=circumference*(1-eased);
      pct.textContent=Math.floor(eased*100)+'%';
      // 切换文案
      var phraseIdx=Math.min(Math.floor(progress*analyzePhrases.length),analyzePhrases.length-1);
      txt.textContent=analyzePhrases[phraseIdx];
      if(progress<1){requestAnimationFrame(animateRing)}
      else{setTimeout(triggerScare,300)}
    }
    requestAnimationFrame(animateRing);
  }

  /* ======================== 音效系统 ======================== */
  var audioCtx=null;
  function initAudio(){
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }

  // 心跳声
  function playHeartbeat(ctx,startAt,count,initialInterval){
    var now=ctx.currentTime;
    var master=ctx.createGain();
    master.gain.value=0.5;master.connect(ctx.destination);
    var t=now+startAt;
    for(var i=0;i<count;i++){
      var interval=initialInterval*Math.pow(0.85,i); // 加速
      // 双击心跳
      for(var j=0;j<2;j++){
        var osc=ctx.createOscillator();
        osc.type='sine';
        osc.frequency.setValueAtTime(50,t);
        osc.frequency.exponentialRampToValueAtTime(30,t+0.1);
        var g=ctx.createGain();
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.7,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
        osc.connect(g);g.connect(master);
        osc.start(t);osc.stop(t+0.15);
        t+=0.18;
      }
      t+=interval-0.36;
    }
  }

  // 门吱呀声
  function playCreak(ctx,startAt){
    var now=ctx.currentTime+startAt;
    var osc=ctx.createOscillator();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(200,now);
    osc.frequency.linearRampToValueAtTime(600,now+0.5);
    osc.frequency.linearRampToValueAtTime(150,now+1.2);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(0.15,now+0.1);
    g.gain.linearRampToValueAtTime(0.08,now+0.8);
    g.gain.linearRampToValueAtTime(0,now+1.5);
    var filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=400;filt.Q.value=8;
    osc.connect(filt);filt.connect(g);g.connect(ctx.destination);
    osc.start(now);osc.stop(now+1.5);
  }

  // 耳语效果(噪声 + 滤波)
  function playWhisper(ctx,startAt,dur){
    var now=ctx.currentTime+startAt;
    var len=ctx.sampleRate*dur;
    var buf=ctx.createBuffer(1,len,ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++){
      var env=Math.sin(i/len*Math.PI);
      d[i]=(Math.random()*2-1)*env;
    }
    var src=ctx.createBufferSource();src.buffer=buf;
    var filt=ctx.createBiquadFilter();
    filt.type='bandpass';filt.frequency.value=800;filt.Q.value=5;
    var g=ctx.createGain();g.gain.value=0.12;
    src.connect(filt);filt.connect(g);g.connect(ctx.destination);
    src.start(now);src.stop(now+dur);
  }

  // 女鬼尖叫
  function playScream(ctx){
    var now=ctx.currentTime;
    var master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);
    // 多层尖叫
    function makeScream(sAt,dur,f0,f1,vol){
      var len=ctx.sampleRate*dur;var buf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<len;i++){
        var p=i/len;var freq=f0+(f1-f0)*p;
        d[i]=(Math.sin(2*Math.PI*freq*i/ctx.sampleRate)*0.6+(Math.random()*2-1)*0.4)*Math.pow(1-p,0.3);
      }
      var src=ctx.createBufferSource();src.buffer=buf;
      var g=ctx.createGain();
      g.gain.setValueAtTime(0,now+sAt);
      g.gain.linearRampToValueAtTime(vol,now+sAt+0.01);
      g.gain.setValueAtTime(vol,now+sAt+dur*0.6);
      g.gain.linearRampToValueAtTime(0,now+sAt+dur);
      src.connect(g);g.connect(master);src.start(now+sAt);src.stop(now+sAt+dur);
    }
    makeScream(0,2.5,800,4500,0.7);
    makeScream(0.05,2.0,1200,5500,0.5);
    makeScream(0.1,1.8,2000,7000,0.4);
    makeScream(0,1.5,400,2000,0.35);
    // 低频轰鸣
    function makeBoom(sAt){

      o.frequency.exponentialRampToValueAtTime(20,now+sAt+2);

      g.gain.setValueAtTime(0,now+sAt);
      g.gain.linearRampToValueAtTime(0.6,now+sAt+0.005);
      g.gain.setValueAtTime(0.6,now+sAt+1.2);
      g.gain.linearRampToValueAtTime(0,now+sAt+2.5);
      o.connect(g);g.connect(master);o.start(now+sAt);o.stop(now+sAt+2.5);
    }
    makeBoom(0);makeBoom(0.3);makeBoom(0.7);

    [185,207,233,277,311,369,466,554].forEach(function(f,j){

      var g=ctx.createGain();
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(0.12,now+0.03);
      g.gain.setValueAtTime(0.12,now+2);g.gain.linearRampToValueAtTime(0,now+4);

  function playSecondScare(ctx){
    var now=ctx.currentTime;var m=ctx.createGain();m.gain.value=1;m.connect(ctx.destination);
    // 超短尖叫
    var len=ctx.sampleRate*0.8;var buf=ctx.createBuffer(1,len,ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++){
      var p=i/len;var freq=1500+3000*p;
      d[i]=(Math.sin(2*Math.PI*freq*i/ctx.sampleRate)*0.5+(Math.random()*2-1)*0.5)*(1-p*0.3);
    }
    var src=ctx.createBufferSource();src.buffer=buf;
    var g=ctx.createGain();g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(1,now+0.005);g.gain.linearRampToValueAtTime(0,now+0.8);
    src.connect(g);g.connect(m);src.start(now);src.stop(now+0.8);
    // 低频冲击
    var boom=ctx.createOscillator();boom.type='sawtooth';
    boom.frequency.setValueAtTime(120,now);boom.frequency.exponentialRampToValueAtTime(15,now+0.5);
    var bg=ctx.createGain();
    bg.gain.setValueAtTime(0.8,now);bg.gain.linearRampToValueAtTime(0,now+0.6);
    boom.connect(bg);bg.connect(m);boom.start(now);boom.stop(now+0.6);
  }

  // 简笔人影轮廓
  function drawShadowFigure(c,w,h,t){
    var fx=sRand(Math.floor(t*7))*w;

    var fs=(0.5+sRand(Math.floor(t*13))*0.5)*Math.min(w,h)/500;

    c.save();c.translate(fx,fy);c.globalAlpha=alpha;
    c.strokeStyle='#fff';c.lineWidth=2;
    // 头
    c.beginPath();c.arc(0,-40*fs,12*fs,0,Math.PI*2);c.stroke();
    // 身体
    c.beginPath();c.moveTo(0,-28*fs);c.lineTo(0,20*fs);c.stroke();
    // 手臂
    c.beginPath();c.moveTo(-20*fs,-10*fs);c.lineTo(20*fs,-10*fs);c.stroke();
    // 腿
    c.beginPath();c.moveTo(0,20*fs);c.lineTo(-15*fs,50*fs);c.moveTo(0,20*fs);c.lineTo(15*fs,50*fs);c.stroke();
    c.globalAlpha=1;c.restore();
  }

  /* ======================== 碎裂效果 ======================== */
  function drawShatter(c,w,h,t){
    var progress=Math.min((t-0)/1,1);
    if(progress<=0)return;
    // 从中心扩散的裂纹
    var cx=w/2,cy=h/2;
    var cracks=12;
    c.strokeStyle='rgba(200,200,200,0.4)';c.lineWidth=2;
    for(var i=0;i<cracks;i++){
      var angle=(i/cracks)*Math.PI*2+sRand(i*7)*0.3;
      var length=Math.min(w,h)*0.6*progress;
      c.beginPath();c.moveTo(cx,cy);
      var px=cx,py=cy;
      for(var j=0;j<6;j++){
        var seg=length/6;
        px+=Math.cos(angle+sRand(i*100+j*50)*0.5-0.25)*seg;
        py+=Math.sin(angle+sRand(i*100+j*50)*0.5-0.25)*seg;
        c.lineTo(px,py);
      }
      c.stroke();
      // 分支裂纹
      if(j>2){
        var bAngle=angle+sRand(i*200)*Math.PI*0.5;
        var bLen=length*0.3*progress;
        c.beginPath();c.moveTo(px,py);
        c.lineTo(px+Math.cos(bAngle)*bLen,py+Math.sin(bAngle)*bLen);c.stroke();
      }
    }
  }

      $('analyzingPage').classList.add('gone');
      $('scarePage').classList.add('show');
      // 渐进式音效
      var ctx=initAudio();
      // 第1秒: 心跳声(从慢到快)
      playHeartbeat(ctx,0,8,0.7);
      // 第1.5秒: 门吱呀声
      playCreak(ctx,1.5);
      // 第2.5秒: 耳语
      playWhisper(ctx,2.5,1.5);
      // 第3秒: 主尖叫(假安全结束后)
      playScream(ctx);
      startScareAnimation();
      // 7秒后淡出
      setTimeout(function(){
        clearInterval(flashInterval);
        if(navigator.vibrate)navigator.vibrate(0);
        $('scarePage').style.transition='opacity 1.5s';
        $('scarePage').style.opacity='0';
        setTimeout(function(){
          cancelAnimationFrame(animId);
          if(audioCtx&&audioCtx.state!=='closed')audioCtx.suspend().catch(function(){});
          $('scarePage').style.transition='';
          $('scarePage').style.display='';
          $('scarePage').style.opacity='';
          $('scarePage').classList.remove('show');
          $('flashOverlay').style.opacity='0';
          // 恢复表单
          resetForm();
          // 安排二次惊吓
          scheduleSecondScare();
        },1500);
      },7000);
    },500);
  }

  function startScareAnimation(){
    canvas=$('scareCanvas');
    ctx2=canvas.getContext('2d');
    var dpr=window.devicePixelRatio||1;
    canvas.width=window.innerWidth*dpr;
    canvas.height=window.innerHeight*dpr;
    ctx2.scale(dpr,dpr);
    canvas.style.width=window.innerWidth+'px';
    canvas.style.height=window.innerHeight+'px';
    faceScale=1;scareStartTime=performance.now()/1000;glitchTimer=0;

    function animate(){
      var t=performance.now()/1000-scareStartTime;
      var w=window.innerWidth,h=window.innerHeight;
      if(canvas.width!==w*dpr||canvas.height!==h*dpr){
        canvas.width=w*dpr;canvas.height=h*dpr;
        ctx2.scale(dpr,dpr);
        canvas.style.width=w+'px';canvas.style.height=h+'px';
      }
      drawScaryFace(ctx2,w,h,t);
      animId=requestAnimationFrame(animate);
    }
    animate();

    // 随机闪烁
    var flash=$('flashOverlay');
    flashInterval=setInterval(function(){
      flash.style.opacity=String(0.7+Math.random()*0.3);
      flash.style.background=Math.random()>0.3?'#fff':'#f00';
      setTimeout(function(){flash.style.opacity='0'},20+Math.random()*40);
    },80+Math.random()*150);

    // 震动
    if(navigator.vibrate){
      navigator.vibrate([500,100,500,100,500,100,800,200,1000]);
    }
  }

  /* ======================== 二次惊吓 ======================== */
  function scheduleSecondScare(){
    setTimeout(function(){
      var sc=$('secondScare');
      var cv=$('secondCanvas');
      var c=cv.getContext('2d');
      var dpr=window.devicePixelRatio||1;
      cv.width=window.innerWidth*dpr;cv.height=window.innerHeight*dpr;
      c.scale(dpr,dpr);
      cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';

      var w=window.innerWidth,h=window.innerHeight;
      // 巨大的恐怖面部瞬间闪现
      c.fillStyle='#000';c.fillRect(0,0,w,h);
      // 画一个超大的眼睛特写
      drawGiantEye(c,w,h);

      sc.classList.add('show');
      var ctx=initAudio();
      playSecondScare(ctx);
      if(navigator.vibrate)navigator.vibrate([200,50,200]);

      // 闪烁效果
      var flash2=$('flashOverlay');
      flash2.style.opacity='0.8';flash2.style.background='#fff';
      setTimeout(function(){flash2.style.opacity='0'},50);

      // 1.5秒后消失
      setTimeout(function(){
        sc.style.transition='opacity 0.8s';sc.style.opacity='0';
        setTimeout(function(){
          sc.classList.remove('show');sc.style.transition='';sc.style.opacity='';
          isRunning=false;
          if(audioCtx&&audioCtx.state!=='closed')audioCtx.suspend().catch(function(){});
          if(navigator.vibrate)navigator.vibrate(0);
        },800);
      },1500);
    },2500);
  }

  // 巨大眼睛特写(二次惊吓用)
  function drawGiantEye(c,w,h){
    var cx=w/2,cy=h/2,er=Math.max(w,h)*0.35;
    // 眼白
    c.beginPath();c.ellipse(cx,cy,er,er*0.65,0,0,Math.PI*2);
    var eg=c.createRadialGradient(cx,cy,er*0.1,cx,cy,er);
    eg.addColorStop(0,'#ccccaa');eg.addColorStop(0.7,'#887755');eg.addColorStop(1,'#443322');
    c.fillStyle=eg;c.fill();
    // 虹膜
    var ir=er*0.45;
    c.beginPath();c.arc(cx,cy,ir,0,Math.PI*2);
    var ig=c.createRadialGradient(cx,cy,ir*0.1,cx,cy,ir);
    ig.addColorStop(0,'#888822');ig.addColorStop(0.5,'#665511');ig.addColorStop(1,'#332200');
    c.fillStyle=ig;c.fill();
    // 瞳孔(针尖大)
    c.beginPath();c.arc(cx,cy,ir*0.15,0,Math.PI*2);c.fillStyle='#000';c.fill();
    // 血丝
    c.strokeStyle='rgba(200,0,0,0.5)';c.lineWidth=2;
    for(var i=0;i<30;i++){
      var a=sRand(i*77)*Math.PI*2;
      var len=er*0.7+sRand(i*33)*er*0.3;
      c.beginPath();
      c.moveTo(cx+Math.cos(a)*ir,cy+Math.sin(a)*ir*0.65);
      var mx=cx+Math.cos(a+sRand(i*55)*0.2-0.1)*len*0.6;
      var my=cy+Math.sin(a+sRand(i*55)*0.2-0.1)*len*0.6*0.65;
      c.quadraticCurveTo(mx,my,cx+Math.cos(a)*len,cy+Math.sin(a)*len*0.65);
      c.stroke();
    }
    // 红色脉冲覆盖
    c.fillStyle='rgba(150,0,0,0.25)';c.fillRect(0,0,w*2,h*2);
  }

  /* ======================== 工具函数 ======================== */
  function resetForm(){
    $('formPage').classList.remove('gone','hidden');
    $('analyzingPage').classList.remove('show');
    $('analyzingPage').classList.add('gone','hidden');
    $('nameInput').value='';$('phoneInput').value='';$('birthdayInput').value='';
    document.querySelectorAll('input[name="gender"]').forEach(function(r){r.checked=false});
    document.querySelectorAll('.tag-item').forEach(function(t){t.classList.remove('selected')});
    document.querySelectorAll('.time-item').forEach(function(t){t.classList.remove('selected')});
    selectedTime='';selectedTags=[];
    // 重置分析页进度
    $('ringFg').style.strokeDashoffset='339.29';
    $('analyzePercent').textContent='0%';
    $('analyzeText').textContent='正在连接灵魂数据库...';
    goStep(1);
  }

  function showToast(msg){
    var old=document.querySelector('.toast-msg');if(old)old.remove();
    var t=document.createElement('div');t.className='toast-msg';t.textContent=msg;
    t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 28px;border-radius:10px;font-size:15px;z-index:300;pointer-events:none;animation:toastFade 2s forwards';
    document.body.appendChild(t);setTimeout(function(){t.remove()},2000);
  }

  window.addEventListener('beforeunload',function(e){e.preventDefault();e.returnValue=''});
  window.addEventListener('resize',function(){
    if(canvas&&$('scarePage').classList.contains('show')){
      var dpr=window.devicePixelRatio||1;
      canvas.width=window.innerWidth*dpr;canvas.height=window.innerHeight*dpr;
      ctx2.scale(dpr,dpr);
      canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';
    }
  });
  updateProgress();
})();
</script>
