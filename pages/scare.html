<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深渊回望</title>
    <style id="theme-vars">
/* ============================================================
   瞳渊 · 灵魂档案 — Brand Design Tokens
   竖瞳之眼 · 深渊回望
   暖奶油灯笼 → 抽象诡异 · 极致反差
   ============================================================ */

:root {
  /* ---- Surfaces: warm cream parchment (cozy lantern parlor) ---- */
  --abyss-background: #f7efe1;
  --abyss-surface: #f0e5d0;
  --abyss-surface-2: #e8d9bd;

  /* ---- Text: warm dark cocoa ---- */
  --abyss-foreground: #3d2c1a;
  --abyss-foreground-secondary: #6b5740;
  --abyss-muted: #e8d9bd;
  --abyss-muted-foreground: #9a8668;

  /* ---- Borders: soft warm tan ---- */
  --abyss-border: #ddcdae;
  --abyss-input: #ddcdae;
  --abyss-ring: #c87f3a;

  /* ---- Brand primary: warm terracotta amber (gentle lantern glow) ---- */
  --abyss-primary: #c87f3a;
  --abyss-primary-foreground: #fdf8f0;

  /* ---- Card ---- */
  --abyss-card: #fdf8ef;
  --abyss-card-foreground: #3d2c1a;

  /* ---- Popover ---- */
  --abyss-popover: #fdf8ef;
  --abyss-popover-foreground: #3d2c1a;

  /* ---- Radius scale ---- */
  --abyss-radius-sm: 4px;
  --abyss-radius-md: 8px;
  --abyss-radius-lg: 16px;

  /* ---- Typography ---- */
  --font-serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;

  /* ---- Spacing (8pt grid) ---- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;

  /* ---- Shadows: soft warm shadows ---- */
  --shadow-1: 0 1px 2px rgba(120,80,30,.04), 0 1px 1px rgba(120,80,30,.03);
  --shadow-2: 0 8px 24px -8px rgba(120,80,30,.18);
  --shadow-3: 0 24px 60px -20px rgba(80,50,15,.28);

  /* ---- State colors ---- */
  --state-error: #a83030;
  --state-error-foreground: #fdf0f0;
  --state-warning: #c88a30;
  --state-success: #5a8a3a;
  --state-info: #4a7a8a;

  /* ---- Decorative: warm antique gold (cozy) ---- */
  --abyss-gold: #b8863a;
  --abyss-gold-dim: #c4a878;
  --abyss-gold-bright: #d4a04a;

  /* ---- Horror palette (pure shock on scare page) ---- */
  --abyss-blood: #8b0000;
  --abyss-blood-bright: #e01010;
  --abyss-bone: #e8e0c8;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--abyss-background);
    --color-foreground: var(--abyss-foreground);
    --color-card: var(--abyss-card);
    --color-card-foreground: var(--abyss-card-foreground);
    --color-popover: var(--abyss-popover);
    --color-popover-foreground: var(--abyss-popover-foreground);
    --color-primary: var(--abyss-primary);
    --color-primary-foreground: var(--abyss-primary-foreground);
    --color-muted: var(--abyss-muted);
    --color-muted-foreground: var(--abyss-muted-foreground);
    --color-border: var(--abyss-border);
    --color-input: var(--abyss-input);
    --color-ring: var(--abyss-ring);
    --radius-sm: var(--abyss-radius-sm);
    --radius-md: var(--abyss-radius-md);
    --radius-lg: var(--abyss-radius-lg);
  }
  @layer base {
    body { background: var(--abyss-background); color: var(--abyss-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;

</head>
<body class="h-screen font-sans antialiased overflow-hidden" style="background:#000;height:100vh;height:100dvh;">
    <main class="relative w-full h-full overflow-hidden bg-black flex flex-col">
      <style>
        /* 突入闪烁 */
        @keyframes jumpFlash {
          0% { opacity: 1; }
          12% { opacity: 0.9; }
          25% { opacity: 1; }
          40% { opacity: 0; }
          100% { opacity: 0; }
        }
        /* 视频突发缩放（收敛幅度，保证奶龙全身不出框） */
        @keyframes scareZoom {
          0% { transform: scale(1.06); filter: brightness(3) saturate(0); }
          8% { transform: scale(1.0); filter: brightness(1.4); }
          14% { transform: scale(1.05); filter: brightness(0.7); }
          22% { transform: scale(1.0); filter: brightness(1); }
          70% { transform: scale(1.0); }
          78% { transform: scale(1.07); filter: brightness(1.6) saturate(2) hue-rotate(-30deg); }
          82% { transform: scale(1.0); filter: brightness(1); }
          100% { transform: scale(1.02); }
        }
        /* 红光脉动 */
        @keyframes vignettePulse {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 0.95; }
        }
        /* 扫描线 */
        @keyframes scanMove {
          from { background-position: 0 0; }
          to { background-position: 0 3px; }
        }
        /* 故障文字 */
        @keyframes glitchA {
          0%, 92%, 100% { transform: translate(0,0); opacity: 1; }
          93% { transform: translate(-4px, 2px); opacity: 0.7; }
          95% { transform: translate(5px, -2px); opacity: 0.9; }
          97% { transform: translate(-2px, 1px); opacity: 0.6; }
        }
        @keyframes glitchB {
          0%, 90%, 100% { opacity: 0; }
          92% { opacity: 0.8; transform: translate(3px, 0); }
          94% { opacity: 0; transform: translate(-3px, 0); }
          96% { opacity: 0.6; transform: translate(2px, 0); }
        }
        /* 副标题抖动 */
        @keyframes subJitter {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-1px); }
          50% { transform: translateX(1px); }
          75% { transform: translateX(-1px); }
        }
        .jump-flash {
          position: absolute; inset: 0; z-index: 40;
          background: radial-gradient(circle, #ff2a2a 0%, #8b0000 45%, #000 100%);
          animation: jumpFlash 0.9s ease-out forwards;
          pointer-events: none;
        }
        /* 视频舞台：flex 定高，保证手机端视频不会塌缩成 0 */
        .scare-stage {
          position: relative;
          z-index: 11;
          flex: 1 1 auto;
          min-height: 0;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          padding-top: env(safe-area-inset-top);
        }
        .scare-video {
          max-width: 100%;
          max-height: 100%;
          width: auto;
          height: auto;
          object-fit: contain;
          transform-origin: center center;
          animation: scareZoom 5s ease-in-out infinite;
          background: #000;
        }
        .red-vignette {
          position: absolute; inset: 0; z-index: 12;
          pointer-events: none;
          box-shadow: inset 0 0 140px 40px rgba(139,0,0,.85), inset 0 0 40px 8px rgba(224,16,16,.35);
          animation: vignettePulse 1.1s ease-in-out infinite;
        }
        .scanlines {
          position: absolute; inset: 0; z-index: 14;
          pointer-events: none;
          background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 3px);
          mix-blend-mode: multiply;
          animation: scanMove 0.12s linear infinite;
        }
        .noise-flicker {
          position: absolute; inset: 0; z-index: 13;
          pointer-events: none;
          background: rgba(20,0,0,.12);
        }
        .horror-title {
          animation: glitchA 2.4s steps(1) infinite;
        }
        .horror-title::after {
          content: attr(data-text);
          position: absolute; inset: 0;
          color: #00e0e0;
          animation: glitchB 2.4s steps(1) infinite;
          mix-blend-mode: screen;
        }
        .horror-sub {
          animation: subJitter 0.18s linear infinite;
        }
        /* 点击解锁层：兼容 iOS 低电量模式 / 微信·QQ 等拦截自动播放的环境 */
        .tap-gate {
          position: fixed; inset: 0; z-index: 60;
          background: #000;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 26px;
          transition: opacity .3s ease;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
        }
        .tap-gate.is-hidden { opacity: 0; pointer-events: none; }
        .gate-eye {
          width: 92px; height: 92px;
          animation: gatePulse 1.8s ease-in-out infinite;
        }
        @keyframes gatePulse {
          0%, 100% { transform: scale(1); opacity: .7; filter: drop-shadow(0 0 10px rgba(212,168,90,.45)); }
          50% { transform: scale(1.09); opacity: 1; filter: drop-shadow(0 0 24px rgba(212,168,90,.95)); }
        }
        .gate-text {
          color: #d4a85a; font-size: 16px;
          letter-spacing: .5em; padding-left: .5em;
          font-family: var(--font-serif, serif);
        }
        .gate-sub {
          color: #6f695c; font-size: 11px;
          letter-spacing: .35em; padding-left: .35em;
          font-family: var(--font-serif, serif);
        }
        @media (prefers-reduced-motion: reduce) {
          .jump-flash { animation: none; opacity: 0; }
          .scare-video { animation: none; }
          .red-vignette { animation: none; }
          .scanlines { display: none; }
          .horror-title, .horror-title::after, .horror-sub { animation: none; }
          .gate-eye { animation: none; }
        }
      </style>

      <!-- 奶龙抽象诡异动画（flex 定高舞台，手机端不塌缩；faststart 视频移动网络秒加载） -->
      <div class="scare-stage">
        <video id="scareVideo" class="scare-video" src="../assets/nailong-abstract.mp4?v=4"
               muted loop playsinline webkit-playsinline x5-playsinline
               preload="auto" disablepictureinpicture></video>
      </div>

      <!-- 红光晕 -->
      <div class="red-vignette"></div>
      <div class="noise-flicker"></div>
      <div class="scanlines"></div>

      <!-- 开场突入闪烁 -->
      <div class="jump-flash"></div>

      <!-- 底部恐怖文字（正常流，预留安全区，不压视频） -->
      <div class="relative z-[20] shrink-0 w-full text-center px-6 pt-3 pb-[max(1.75rem,env(safe-area-inset-bottom))] pointer-events-none">
        <h1 class="horror-title relative font-serif text-[30px] font-bold tracking-[0.18em] inline-block" data-text="找到你了" style="color: var(--abyss-bone); text-shadow: 0 0 18px rgba(224,16,16,.85), 2px 0 0 rgba(224,16,16,.6);">找到你了</h1>
        <p class="horror-sub font-serif text-[13px] mt-3 tracking-[0.25em]" style="color: #ff3a3a;">它一直是奶龙</p>
      </div>

      <!-- 右上角按钮 -->
      <div class="absolute top-3 right-3 z-30 flex items-center gap-2" style="top:max(0.75rem,env(safe-area-inset-top));">
        <button aria-label="静音" class="w-[42px] h-[42px] rounded-full bg-black/55 border border-white/25 flex items-center justify-center backdrop-blur-sm">
          <i data-lucide="volume-x" class="w-5 h-5 text-white/70"></i>
        </button>
        <button aria-label="关闭" class="w-[42px] h-[42px] rounded-full bg-black/55 border border-white/25 flex items-center justify-center backdrop-blur-sm opacity-30 pointer-events-none">
          <i data-lucide="x" class="w-5 h-5 text-white/70"></i>
        </button>
      </div>
      <!-- 点击解锁层（用户手势可在所有手机浏览器中解锁播放，含微信/iOS 低电量） -->
      <div id="tapGate" class="tap-gate" role="button" aria-label="轻触屏幕开始">
        <svg class="gate-eye" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 50 C28 20 72 20 95 50 C72 80 28 80 5 50 Z" stroke="#d4a85a" stroke-width="2.2"/>
          <circle cx="50" cy="50" r="19" stroke="#d4a85a" stroke-width="1.4" opacity="0.7"/>
          <ellipse cx="50" cy="50" rx="5.2" ry="16.5" fill="#d4a85a"/>
          <circle cx="50" cy="40" r="1.6" fill="#1a1510"/>
        </svg>
        <div class="gate-text">轻 触 屏 幕</div>
        <div class="gate-sub">凝 视 深 渊</div>
      </div>
    </main>
    <script>
      lucide.createIcons();

      // 惊吓揭示：由「点击解锁」或「自动播放被允许」统一触发
      (function () {
        var v = document.getElementById('scareVideo');
        var gate = document.getElementById('tapGate');
        var flash = document.querySelector('.jump-flash');
        var started = false;

        function retrigger(el) {
          if (!el) return;
          el.style.animation = 'none';
          void el.offsetWidth;
          el.style.animation = '';
        }

        function beginScare() {
          if (started) return;
          started = true;
          v.muted = true;
          try { v.currentTime = 0; } catch (e) {}
          var p = v.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function () {
              // 极少数内核仍拦截：保持解锁层，等待用户再点一次
              started = false;
            });
          }
          retrigger(flash);       // 血红突入与揭示瞬间对齐
          retrigger(v);           // 缩放动画从头开始
          gate.classList.add('is-hidden');
          setTimeout(function () { gate.style.display = 'none'; }, 350);
        }

        // 用户手势：touchend 立即响应，click 兜底桌面/微信
        gate.addEventListener('touchend', function (e) {
          e.preventDefault();
          beginScare();
        }, { passive: false });
        gate.addEventListener('click', beginScare);

        // 后台回来 / 页面回退时续播
        function resume() {
          v.muted = true;
          var p = v.play();
          if (p && typeof p.catch === 'function') p.catch(function () {});
        }
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) resume();
        });
        window.addEventListener('pageshow', resume);

        // 探测自动播放：允许的环境（多数桌面/安卓）短暂延迟后自动揭示
        v.muted = true;
        var probe = v.play();
        if (probe && typeof probe.then === 'function') {
          probe.then(function () {
            v.pause();
            try { v.currentTime = 0; } catch (e) {}
            setTimeout(beginScare, 450);
          }).catch(function () {
            v.load(); // 被拦截：预加载，等用户点击
          });
        }
      })();
    </script>
</body>
</html>
