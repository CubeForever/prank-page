<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵魂深渊凝视中</title>
    <style id="theme-vars">
/* ============================================================
   瞳渊 · 灵魂档案 — Brand Design Tokens
   竖瞳之眼 · 深渊回望
   暖奶油灯笼 → 抽象诡异 · 极致反差
   ============================================================ */

:root {
  /* ---- Surfaces: warm cream parchment (cozy lantern parlor) ---- */
  --abyss-background: #f7efe1;
  --abyss-surface: #f0e5d0;
  --abyss-surface-2: #e8d9bd;

  /* ---- Text: warm dark cocoa ---- */
  --abyss-foreground: #3d2c1a;
  --abyss-foreground-secondary: #6b5740;
  --abyss-muted: #e8d9bd;
  --abyss-muted-foreground: #9a8668;

  /* ---- Borders: soft warm tan ---- */
  --abyss-border: #ddcdae;
  --abyss-input: #ddcdae;
  --abyss-ring: #c87f3a;

  /* ---- Brand primary: warm terracotta amber (gentle lantern glow) ---- */
  --abyss-primary: #c87f3a;
  --abyss-primary-foreground: #fdf8f0;

  /* ---- Card ---- */
  --abyss-card: #fdf8ef;
  --abyss-card-foreground: #3d2c1a;

  /* ---- Popover ---- */
  --abyss-popover: #fdf8ef;
  --abyss-popover-foreground: #3d2c1a;

  /* ---- Radius scale ---- */
  --abyss-radius-sm: 4px;
  --abyss-radius-md: 8px;
  --abyss-radius-lg: 16px;

  /* ---- Typography ---- */
  --font-serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;

  /* ---- Spacing (8pt grid) ---- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;

  /* ---- Shadows: soft warm shadows ---- */
  --shadow-1: 0 1px 2px rgba(120,80,30,.04), 0 1px 1px rgba(120,80,30,.03);
  --shadow-2: 0 8px 24px -8px rgba(120,80,30,.18);
  --shadow-3: 0 24px 60px -20px rgba(80,50,15,.28);

  /* ---- State colors ---- */
  --state-error: #a83030;
  --state-error-foreground: #fdf0f0;
  --state-warning: #c88a30;
  --state-success: #5a8a3a;
  --state-info: #4a7a8a;

  /* ---- Decorative: warm antique gold (cozy) ---- */
  --abyss-gold: #b8863a;
  --abyss-gold-dim: #c4a878;
  --abyss-gold-bright: #d4a04a;

  /* ---- Horror palette (pure shock on scare page) ---- */
  --abyss-blood: #8b0000;
  --abyss-blood-bright: #e01010;
  --abyss-bone: #e8e0c8;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--abyss-background);
    --color-foreground: var(--abyss-foreground);
    --color-card: var(--abyss-card);
    --color-card-foreground: var(--abyss-card-foreground);
    --color-popover: var(--abyss-popover);
    --color-popover-foreground: var(--abyss-popover-foreground);
    --color-primary: var(--abyss-primary);
    --color-primary-foreground: var(--abyss-primary-foreground);
    --color-muted: var(--abyss-muted);
    --color-muted-foreground: var(--abyss-muted-foreground);
    --color-border: var(--abyss-border);
    --color-input: var(--abyss-input);
    --color-ring: var(--abyss-ring);
    --radius-sm: var(--abyss-radius-sm);
    --radius-md: var(--abyss-radius-md);
    --radius-lg: var(--abyss-radius-lg);
  }
  @layer base {
    body { background: var(--abyss-background); color: var(--abyss-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--abyss-background); }
      .text-background { color: var(--abyss-background); }
      .border-background { border-color: var(--abyss-background); }
      .ring-background { --tw-ring-color: var(--abyss-background); }
      .bg-foreground { background-color: var(--abyss-foreground); }
      .text-foreground { color: var(--abyss-foreground); }
      .border-foreground { border-color: var(--abyss-foreground); }
      .ring-foreground { --tw-ring-color: var(--abyss-foreground); }
      .bg-card { background-color: var(--abyss-card); }
      .text-card { color: var(--abyss-card); }
      .border-card { border-color: var(--abyss-card); }
      .ring-card { --tw-ring-color: var(--abyss-card); }
      .bg-card-foreground { background-color: var(--abyss-card-foreground); }
      .text-card-foreground { color: var(--abyss-card-foreground); }
      .border-card-foreground { border-color: var(--abyss-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--abyss-card-foreground); }
      .bg-popover { background-color: var(--abyss-popover); }
      .text-popover { color: var(--abyss-popover); }
      .border-popover { border-color: var(--abyss-popover); }
      .ring-popover { --tw-ring-color: var(--abyss-popover); }
      .bg-popover-foreground { background-color: var(--abyss-popover-foreground); }
      .text-popover-foreground { color: var(--abyss-popover-foreground); }
      .border-popover-foreground { border-color: var(--abyss-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--abyss-popover-foreground); }
      .bg-primary { background-color: var(--abyss-primary); }
      .text-primary { color: var(--abyss-primary); }
      .border-primary { border-color: var(--abyss-primary); }
      .ring-primary { --tw-ring-color: var(--abyss-primary); }
      .bg-primary-foreground { background-color: var(--abyss-primary-foreground); }
      .text-primary-foreground { color: var(--abyss-primary-foreground); }
      .border-primary-foreground { border-color: var(--abyss-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--abyss-primary-foreground); }
      .bg-muted { background-color: var(--abyss-muted); }
      .text-muted { color: var(--abyss-muted); }
      .border-muted { border-color: var(--abyss-muted); }
      .ring-muted { --tw-ring-color: var(--abyss-muted); }
      .bg-muted-foreground { background-color: var(--abyss-muted-foreground); }
      .text-muted-foreground { color: var(--abyss-muted-foreground); }
      .border-muted-foreground { border-color: var(--abyss-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--abyss-muted-foreground); }
      .bg-border { background-color: var(--abyss-border); }
      .text-border { color: var(--abyss-border); }
      .border-border { border-color: var(--abyss-border); }
      .ring-border { --tw-ring-color: var(--abyss-border); }
      .bg-input { background-color: var(--abyss-input); }
      .text-input { color: var(--abyss-input); }
      .border-input { border-color: var(--abyss-input); }
      .ring-input { --tw-ring-color: var(--abyss-input); }
      .bg-ring { background-color: var(--abyss-ring); }
      .text-ring { color: var(--abyss-ring); }
      .border-ring { border-color: var(--abyss-ring); }
      .ring-ring { --tw-ring-color: var(--abyss-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden" style="background: var(--abyss-background);">
      <style>
        @keyframes abyss-pulse-dots {
          0%, 100% { opacity: 0.3; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.15); }
        }
        @keyframes abyss-ring-glow {
          0%, 100% { filter: drop-shadow(0 0 4px var(--abyss-primary)); }
          50% { filter: drop-shadow(0 0 9px var(--abyss-primary)) drop-shadow(0 0 15px var(--abyss-primary)); }
        }
        @keyframes abyss-breathe {
          0%, 100% { opacity: 0.04; transform: scale(1); }
          50% { opacity: 0.07; transform: scale(1.05); }
        }
        @keyframes abyss-drift-a {
          0% { opacity: 0; transform: translate(0,0); }
          45% { opacity: 0.7; }
          100% { opacity: 0; transform: translate(10px,-18px); }
        }
        @keyframes abyss-drift-b {
          0% { opacity: 0; transform: translate(0,0); }
          45% { opacity: 0.6; }
          100% { opacity: 0; transform: translate(-12px,-22px); }
        }
        @keyframes abyss-drift-c {
          0% { opacity: 0; transform: translate(0,0); }
          45% { opacity: 0.5; }
          100% { opacity: 0; transform: translate(6px,-26px); }
        }
        @media (prefers-reduced-motion: reduce) {
          .abyss-animate { animation: none !important; }
        }
      </style>

      <!-- 背景装饰：竖瞳之眼轮廓 -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none" aria-hidden="true">
        <svg width="280" height="280" viewBox="0 0 100 100" class="abyss-animate" style="opacity: 0.04; animation: abyss-breathe 6s ease-in-out infinite;">
          <ellipse cx="50" cy="50" rx="40" ry="22" fill="none" stroke="var(--abyss-gold)" stroke-width="0.5"/>
          <ellipse cx="50" cy="50" rx="20" ry="20" fill="none" stroke="var(--abyss-gold-dim)" stroke-width="0.3"/>
          <ellipse cx="50" cy="50" rx="8" ry="18" fill="var(--abyss-primary)" opacity="0.5"/>
          <ellipse cx="50" cy="42" rx="2" ry="3" fill="var(--abyss-gold-bright)" opacity="0.6"/>
          <line x1="10" y1="50" x2="2" y2="50" stroke="var(--abyss-gold)" stroke-width="0.3" opacity="0.6"/>
          <line x1="90" y1="50" x2="98" y2="50" stroke="var(--abyss-gold)" stroke-width="0.3" opacity="0.6"/>
          <line x1="50" y1="28" x2="50" y2="22" stroke="var(--abyss-gold)" stroke-width="0.3" opacity="0.4"/>
          <line x1="50" y1="72" x2="50" y2="78" stroke="var(--abyss-gold)" stroke-width="0.3" opacity="0.4"/>
        </svg>
      </div>

      <!-- 散落小光点 -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <span class="absolute block rounded-full abyss-animate" style="left: 18%; top: 22%; width: 3px; height: 3px; background: var(--abyss-gold-dim); animation: abyss-drift-a 7s ease-in-out infinite;"></span>
        <span class="absolute block rounded-full abyss-animate" style="right: 20%; top: 30%; width: 2px; height: 2px; background: var(--abyss-gold-dim); animation: abyss-drift-b 9s ease-in-out 1.5s infinite;"></span>
        <span class="absolute block rounded-full abyss-animate" style="left: 28%; bottom: 26%; width: 2.5px; height: 2.5px; background: var(--abyss-gold-dim); animation: abyss-drift-c 8s ease-in-out 3s infinite;"></span>
        <span class="absolute block rounded-full abyss-animate" style="right: 24%; bottom: 22%; width: 2px; height: 2px; background: var(--abyss-gold-dim); animation: abyss-drift-a 10s ease-in-out 2.2s infinite;"></span>
        <span class="absolute block rounded-full abyss-animate" style="left: 45%; top: 14%; width: 1.5px; height: 1.5px; background: var(--abyss-gold-dim); animation: abyss-drift-b 11s ease-in-out 4s infinite;"></span>
      </div>

      <!-- 主内容 -->
      <div class="relative z-10 flex flex-col items-center px-6 text-center">
        <!-- 进度环 -->
        <div class="relative w-[120px] h-[120px] mb-8">
          <svg viewBox="0 0 120 120" class="w-full h-full" style="transform: rotate(-90deg);" aria-hidden="true">
            <circle cx="60" cy="60" r="54" fill="none" stroke="var(--abyss-border)" stroke-width="4"/>
            <circle id="ring" cx="60" cy="60" r="54" fill="none" stroke="var(--abyss-primary)" stroke-width="4" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" class="abyss-animate" style="filter: drop-shadow(0 0 6px var(--abyss-primary)); animation: abyss-ring-glow 3s ease-in-out infinite;"/>
          </svg>
          <div class="absolute inset-0 flex items-center justify-center">
            <span id="percent" class="font-serif text-[32px] font-bold" style="font-family: var(--font-serif); color: var(--abyss-gold); text-shadow: 0 0 8px var(--abyss-gold-dim);">0%</span>
          </div>
        </div>

        <!-- 加载文字 -->
        <div class="text-center mb-3">
          <div class="font-serif text-[12px] tracking-[0.3em] mb-2" style="font-family: var(--font-serif); color: var(--abyss-gold-dim);">瞳渊</div>
          <div id="loadText" class="font-serif text-[15px] min-h-[24px]" style="font-family: var(--font-serif); color: var(--abyss-foreground-secondary);">正在凝视灵魂深渊…</div>
        </div>

        <!-- 装饰点 -->
        <div class="flex gap-2 mt-4" aria-hidden="true">
          <span class="w-1.5 h-1.5 rounded-full abyss-animate" style="background: var(--abyss-muted-foreground); animation: abyss-pulse-dots 1.4s ease-in-out infinite;"></span>
          <span class="w-1.5 h-1.5 rounded-full abyss-animate" style="background: var(--abyss-muted-foreground); animation: abyss-pulse-dots 1.4s ease-in-out 0.2s infinite;"></span>
          <span class="w-1.5 h-1.5 rounded-full abyss-animate" style="background: var(--abyss-muted-foreground); animation: abyss-pulse-dots 1.4s ease-in-out 0.4s infinite;"></span>
        </div>

        <!-- 底部低语 -->
        <div class="mt-12 text-[11px] tracking-[0.15em] max-w-[260px]" style="font-family: var(--font-sans); color: var(--abyss-muted-foreground);">请保持安静，深渊正在回望你</div>
      </div>
    </main>
    <script>
      lucide.createIcons();

      // 进度动画 → 自动进入惊吓页
      const ring = document.getElementById('ring');
      const percent = document.getElementById('percent');
      const loadText = document.getElementById('loadText');
      const CIRC = 339.29;
      const phrases = [
        '正在凝视灵魂深渊…',
        '已锁定你的生辰气息…',
        '深渊正在回望你…',
        '它，看到你了…'
      ];
      const DURATION = 3600;
      const start = performance.now();

      function tick(now) {
        const t = Math.min((now - start) / DURATION, 1);
        // easeInOut，末段略微加速制造不安
        const eased = t < 0.7 ? t / 0.7 * 0.85 : 0.85 + (t - 0.7) / 0.3 * 0.15;
        const val = Math.round(eased * 100);
        percent.textContent = val + '%';
        ring.style.strokeDashoffset = CIRC * (1 - eased);
        loadText.textContent = phrases[Math.min(phrases.length - 1, Math.floor(t * phrases.length))];
        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          setTimeout(() => { window.location.href = 'scare.html'; }, 500);
        }
      }
      requestAnimationFrame(tick);
    </script>
</body>
</html>
