<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵魂档案·占卜表单</title>
    <style id="theme-vars">
/* ============================================================
   瞳渊 · 灵魂档案 — Brand Design Tokens
   竖瞳之眼 · 深渊回望
   暖奶油灯笼 → 抽象诡异 · 极致反差
   ============================================================ */

:root {
  /* ---- Surfaces: warm cream parchment (cozy lantern parlor) ---- */
  --abyss-background: #f7efe1;
  --abyss-surface: #f0e5d0;
  --abyss-surface-2: #e8d9bd;

  /* ---- Text: warm dark cocoa ---- */
  --abyss-foreground: #3d2c1a;
  --abyss-foreground-secondary: #6b5740;
  --abyss-muted: #e8d9bd;
  --abyss-muted-foreground: #9a8668;

  /* ---- Borders: soft warm tan ---- */
  --abyss-border: #ddcdae;
  --abyss-input: #ddcdae;
  --abyss-ring: #c87f3a;

  /* ---- Brand primary: warm terracotta amber (gentle lantern glow) ---- */
  --abyss-primary: #c87f3a;
  --abyss-primary-foreground: #fdf8f0;

  /* ---- Card ---- */
  --abyss-card: #fdf8ef;
  --abyss-card-foreground: #3d2c1a;

  /* ---- Popover ---- */
  --abyss-popover: #fdf8ef;
  --abyss-popover-foreground: #3d2c1a;

  /* ---- Radius scale ---- */
  --abyss-radius-sm: 4px;
  --abyss-radius-md: 8px;
  --abyss-radius-lg: 16px;

  /* ---- Typography ---- */
  --font-serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;

  /* ---- Spacing (8pt grid) ---- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;

  /* ---- Shadows: soft warm shadows ---- */
  --shadow-1: 0 1px 2px rgba(120,80,30,.04), 0 1px 1px rgba(120,80,30,.03);
  --shadow-2: 0 8px 24px -8px rgba(120,80,30,.18);
  --shadow-3: 0 24px 60px -20px rgba(80,50,15,.28);

  /* ---- State colors ---- */
  --state-error: #a83030;
  --state-error-foreground: #fdf0f0;
  --state-warning: #c88a30;
  --state-success: #5a8a3a;
  --state-info: #4a7a8a;

  /* ---- Decorative: warm antique gold (cozy) ---- */
  --abyss-gold: #b8863a;
  --abyss-gold-dim: #c4a878;
  --abyss-gold-bright: #d4a04a;

  /* ---- Horror palette (pure shock on scare page) ---- */
  --abyss-blood: #8b0000;
  --abyss-blood-bright: #e01010;
  --abyss-bone: #e8e0c8;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--abyss-background);
    --color-foreground: var(--abyss-foreground);
    --color-card: var(--abyss-card);
    --color-card-foreground: var(--abyss-card-foreground);
    --color-popover: var(--abyss-popover);
    --color-popover-foreground: var(--abyss-popover-foreground);
    --color-primary: var(--abyss-primary);
    --color-primary-foreground: var(--abyss-primary-foreground);
    --color-muted: var(--abyss-muted);
    --color-muted-foreground: var(--abyss-muted-foreground);
    --color-border: var(--abyss-border);
    --color-input: var(--abyss-input);
    --color-ring: var(--abyss-ring);
    --radius-sm: var(--abyss-radius-sm);
    --radius-md: var(--abyss-radius-md);
    --radius-lg: var(--abyss-radius-lg);
  }
  @layer base {
    body { background: var(--abyss-background); color: var(--abyss-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

</head>
<body class="min-h-screen font-sans antialiased">

                    <div class="h-full w-1/4 rounded-full transition-all duration-500 bg-[var(--abyss-gold)]"></div>

                    <div class="text-center py-2.5 px-1 border border-[var(--abyss-primary)] rounded-[var(--abyss-radius-md)] cursor-pointer transition-all bg-[var(--abyss-surface-2)] text-[var(--abyss-primary)]">

                    <div class="text-center py-2.5 px-1 border border-[var(--abyss-border)] rounded-[var(--abyss-radius-md)] cursor-pointer transition-all bg-[var(--abyss-surface)] text-[var(--abyss-foreground)] hover:border-[var(--abyss-primary)] hover:text-[var(--abyss-primary)]">
                        <div class="text-[13px] font-semibold">寅时</div>
                        <div class="text-[10px] mt-0.5 text-[var(--abyss-muted-foreground)]">03-05</div>
                    </div>
                    <div class="text-center py-2.5 px-1 border border-[var(--abyss-border)] rounded-[var(--abyss-radius-md)] cursor-pointer transition-all bg-[var(--abyss-surface)] text-[var(--abyss-foreground)] hover:border-[var(--abyss-primary)] hover:text-[var(--abyss-primary)]">
                        <div class="text-[13px] font-semibold">卯时</div>
                        <div class="text-[10px] mt-0.5 text-[var(--abyss-muted-foreground)]">05-07</div>
                    </div>
                    <div class="text-center py-2.5 px-1 border border-[var(--abyss-border)] rounded-[var(--abyss-radius-md)] cursor-pointer transition-all bg-[var(--abyss-surface)] text-[var(--abyss-foreground)] hover:border-[var(--abyss-primary)] hover:text-[var(--abyss-primary)]">
                        <div class="text-[13px] font-semibold">辰时</div>
                        <div class="text-[10px] mt-0.5 text-[var(--abyss-muted-foreground)]">07-09</div>
                    </div>
                    <div class="text-center py-2.5 px-1 border border-[var(--abyss-border)] rounded-[var(--abyss-radius-md)] cursor-pointer transition-all bg-[var(--abyss-surface)] text-[var(--abyss-foreground)] hover:border-[var(--abyss-primary)] hover:text-[var(--abyss-primary)]">

                    </div>

    <script>
      lucide.createIcons();

      // 时辰点选
      const grid = document.getElementById('timeGrid');
      const cells = Array.from(grid.children);
      let selectedTime = '子时';
      const active = ['border-[var(--abyss-primary)]','bg-[var(--abyss-surface-2)]','text-[var(--abyss-primary)]'];
      const idle = ['border-[var(--abyss-border)]','bg-[var(--abyss-surface)]','text-[var(--abyss-foreground)]'];
      cells.forEach(cell => {
        cell.addEventListener('click', () => {
          cells.forEach(c => {
            c.classList.remove(...active); c.classList.add(...idle);
          });
          cell.classList.remove(...idle); cell.classList.add(...active);
          selectedTime = cell.querySelector('div').textContent.trim();
        });
      });

      // 进入凝视（分析页）
      document.getElementById('startBtn').addEventListener('click', () => {
        try {
          const date = document.getElementById('birthDate').value || '未填写';
          sessionStorage.setItem('abyss_fortune', JSON.stringify({ date, time: selectedTime }));
        } catch (e) {}
        window.location.href = 'analyzing.html';
      });
    </script>
</body>
